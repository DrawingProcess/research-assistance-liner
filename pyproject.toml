[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistance-liner"
version = "0.2.0"
description = "Data-free, evidence-first research assistance template (v2 hub-centric pipeline)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
